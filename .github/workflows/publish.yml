name: Publish to npm

# Publishes when a version tag (e.g. v1.3.0) is pushed, or manually via "Run workflow".
# Uses npm Trusted Publishing (OIDC) - no npm token needed.
# On tag runs the tag must match the version in package.json.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          set -o pipefail
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          if ! npm publish --access public --loglevel verbose 2>&1 | tee publish.log; then
            # Surface OIDC diagnostics and the npm error as annotations (visible on the run summary)
            grep -iE "oidc|trusted|provenance|npm error" publish.log | grep -v "complete log" | tail -20 | while IFS= read -r line; do
              echo "::error title=npm publish::${line}"
            done
            exit 1
          fi
